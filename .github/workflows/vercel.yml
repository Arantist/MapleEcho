name: Vercel Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Install Vercel CLI
        run: npm install --global vercel@55.0.0

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Ensure production project is active
        run: >-
          curl --fail --silent --show-error --request POST
          --header "Authorization: Bearer $VERCEL_TOKEN"
          "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/unpause?teamId=$VERCEL_ORG_ID"

      - name: Deploy production
        run: vercel deploy --prod --force --yes --token="$VERCEL_TOKEN"
