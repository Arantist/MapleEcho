name: Vercel Deploy

# Vercel validates the real Git commit author against the project account.

on:
  push:
    branches:
      - main

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_GIT_AUTHOR_EMAIL: ${{ secrets.VERCEL_GIT_AUTHOR_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Install Vercel CLI
        run: npm install --global vercel@55.0.0

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy production
        run: >-
          vercel deploy --prod --force --yes
          --meta githubCommitAuthorEmail="$VERCEL_GIT_AUTHOR_EMAIL"
          --token="$VERCEL_TOKEN"

      - name: Restrict public domains
        shell: bash
        run: |
          curl --fail --silent --show-error --request PATCH \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"redirect":"fengye-rain.life","redirectStatusCode":308}' \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/domains/www.fengye-rain.life?teamId=$VERCEL_ORG_ID" \
            > /dev/null

          delete_status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --request DELETE \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/domains/local-stem-splitter.vercel.app?teamId=$VERCEL_ORG_ID")

          if [[ "$delete_status" != "200" && "$delete_status" != "404" ]]; then
            echo "Failed to remove the public Vercel default domain: HTTP $delete_status"
            exit 1
          fi
